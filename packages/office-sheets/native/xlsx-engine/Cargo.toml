[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Streaming and surgical-save .xlsx engine sidecar for BrainOnDesk Sheets (ported from AugmentOffice)."

[dependencies]
base64 = "0.22.1"
calamine = "0.36.0"
ironcalc = "0.7.1"
quick-xml = "0.38"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = "symbols"

# Standalone Cargo workspace so the crate never gets adopted by a parent
# workspace that happens to sit above the monorepo.
[workspace]
