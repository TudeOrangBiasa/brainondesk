name: slow-tests

# Test layers too slow for every PR (server ~15 min, CLI, native-config cargo).
# Not a required check. Runs nightly on main, by hand (Actions > slow-tests >
# Run workflow), and on PRs that touch these packages. See docs/TESTING.md.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/server/**"
      - "packages/cli/**"
      - "packages/native-config/**"
      - ".github/workflows/slow-tests.yml"

concurrency:
  group: slow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ELECTRON_SKIP_REBUILD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  test:
    name: slow (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            filter: "@inkeep/open-knowledge-server"
          - name: cli
            filter: "@inkeep/open-knowledge"
          - name: native-config
            filter: "@inkeep/open-knowledge-native-config"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: slow-${{ matrix.name }}

      - name: Tests
        run: pnpm exec turbo run test --filter='${{ matrix.filter }}' --output-logs=errors-only
