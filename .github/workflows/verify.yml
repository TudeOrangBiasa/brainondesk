name: verify

# Required status check for main: the `verify` job below. It only goes green
# when every other job succeeded (policy is skipped on push). Keep the job id
# and name stable; branch protection matches on the name.
# GitHub-hosted runners only, no repository secrets, read-only token.
# Local mirror: `pnpm verify` (scripts/verify.sh).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ELECTRON_SKIP_REBUILD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  policy:
    name: policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: PR title, linked issue, protected paths
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-policy.mjs

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks

      - name: Secret scan (PR commits)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" .

  checks:
    name: lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: checks

      - name: Lint (biome + oxlint, no-comments)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build desktop bundle (electron-vite, no packaging)
        run: pnpm exec turbo run build:desktop --filter=@inkeep/open-knowledge-desktop --output-logs=errors-only

      - name: PR policy script tests
        run: pnpm exec vitest run --config vitest.scripts.config.ts scripts/check-pr-policy.test.mjs

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [core, app, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: test-${{ matrix.package }}

      - name: Unit tests
        run: pnpm exec turbo run test --filter=@inkeep/open-knowledge-${{ matrix.package }} --output-logs=errors-only

  verify:
    name: verify
    if: always()
    needs: [policy, checks, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(needs).filter(([job, r]) =>
              !(r.result === "success" || (job === "policy" && r.result === "skipped" && process.env.GITHUB_EVENT_NAME !== "pull_request")));
            if (bad.length) { console.error("Failed gates:", bad.map(([j, r]) => `${j}=${r.result}`).join(", ")); process.exit(1); }
          '
