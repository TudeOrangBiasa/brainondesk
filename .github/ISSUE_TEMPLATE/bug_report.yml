name: Bug report
description: Report something that isn't working in BrainOnDesk
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in so the bug can be reproduced. The agent that picks up this issue will start from a failing test that follows the steps below.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I'm on the latest version (or I've noted my version below)
          required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (Fedora)
        - Linux (other)
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install BrainOnDesk?
      options:
        - Desktop app (Linux build / rpm)
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Desktop: Help → About. CLI: run with --version."
      placeholder: "e.g. 0.16.1"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead. This becomes the test assertion.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, errors, or screenshots
      description: Paste any console output or attach screenshots. Text is rendered as code.
      render: shell
    validations:
      required: false
